version: "3.9"

services:
  mongodb:
    image: mongo:8
    container_name: mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: jobmail

    volumes:
      - mongo-data:/data/db

    networks:
      - jobmail-network

  backend:
    build:
      context: ../application/backend
      dockerfile: Dockerfile


    env_file:
    - ../application/backend/.env  

    container_name: backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    environment:
      PORT: 5000
      NODE_ENV: development
      MONGO_URI: mongodb://admin:admin123@mongodb:27017/jobmail?authSource=admin

    depends_on:
      - mongodb

    networks:
      - jobmail-network

  frontend:
    build:
      context: ../application/frontend
      dockerfile: Dockerfile

    container_name: frontend

    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - jobmail-network

volumes:
  mongo-data:

networks:
  jobmail-network:
    driver: bridge